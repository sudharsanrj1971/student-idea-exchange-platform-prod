worker_rlimit_nofile 100000;

events {
  worker_processes auto;
  worker_connections 10000;
}

http {
  # ── Upstream (2 backend replicas) ─────────────────────
  upstream backend {
    ip_hash;
    server backend:5000;  # Docker Compose service resolves to both replicas
    keepalive 64;
  }

  # ── Rate limiting ──────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ── HTTP → HTTPS redirect ─────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name ichange.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # ── Security headers ───────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # ── API routes ─────────────────────────────────────
    location /api {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Auth endpoints get stricter limiting
    location /api/auth/login {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://backend;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Socket.IO WebSocket ────────────────────────────
    location /socket.io {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400s;  # 24h for long-lived WS
      proxy_send_timeout 86400s;
    }

    # ── Static frontend (if self-hosted) ──────────────
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── Health check ───────────────────────────────────
    location /health {
      proxy_pass http://backend;
      access_log off;
    }
  }
}
