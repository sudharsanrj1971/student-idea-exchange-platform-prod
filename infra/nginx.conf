################################################################################
# iChange Nginx Reverse Proxy Configuration
# Fixes Bug Class 3 (Timeouts) — proxy_read_timeout was too low for HLS segments
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/ichange
#         sudo ln -s /etc/nginx/sites-available/ichange /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
################################################################################

upstream ichange_backend {
    # Round-robin across PM2 cluster workers (all bind to same port via cluster)
    server 127.0.0.1:5000;
    keepalive 64;  # Keep 64 idle upstream connections — avoids TCP handshake on every request
}

server {
    listen 80;
    server_name ichange.yourdomain.com;

    # Redirect all HTTP → HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ichange.yourdomain.com;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/ichange.crt;
    ssl_certificate_key /etc/ssl/private/ichange.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_proxied any;

    # ── Global Proxy Timeouts (FIX Bug Class 3) ──────────────
    # Default proxy_read_timeout is 60s — too low for HLS segment generation
    # which can take 2-10s under load. Increasing prevents 504 Gateway Timeout.
    proxy_read_timeout   120s;   # was 60s default; needed for HLS segment responses
    proxy_send_timeout   120s;   # was 60s default
    proxy_connect_timeout 10s;   # was 60s default; fail fast on backend unreachable

    # ── Keep-Alive ────────────────────────────────────────────
    keepalive_timeout 75s;       # Matches upstream keepalive; reduces connection churn
    keepalive_requests 1000;

    # ── Client Body ──────────────────────────────────────────
    client_max_body_size 10m;    # Allow file uploads up to 10MB

    # ── Common Proxy Headers ─────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # ── API Routes ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ichange_backend;
    }

    # ── Socket.IO (WebSocket upgrade) ────────────────────────
    location /socket.io/ {
        proxy_pass         http://ichange_backend;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Longer timeout for WebSocket: keep-alive connections must survive pingInterval
        proxy_read_timeout 86400s;  # 24h — WebSocket connections are long-lived
    }

    # ── HLS Streaming ─────────────────────────────────────────
    location /stream/ {
        proxy_pass       http://ichange_backend;
        # HLS segments can take time to generate; allow up to 30s
        proxy_read_timeout 30s;
        add_header       Cache-Control "no-cache";
        add_header       Access-Control-Allow-Origin "*";
    }

    # ── Static File Uploads ───────────────────────────────────
    location /uploads/ {
        proxy_pass http://ichange_backend;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health Check ─────────────────────────────────────────
    location /health {
        proxy_pass http://ichange_backend;
        access_log off;  # Don't pollute logs with health check noise
    }

    # ── Frontend (React SPA) ──────────────────────────────────
    location / {
        root  /var/www/ichange/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback for React Router
        expires 1h;
        add_header Cache-Control "public";
    }
}
